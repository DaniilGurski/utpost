# Startar bara databasen. Applikationen kör vi lokalt med npm run dev.
# Port 5433 på värden så att den inte krockar med en lokalt installerad Postgres.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: utpost
      POSTGRES_PASSWORD: utpost
      POSTGRES_DB: utpost
    ports:
      - "5433:5432"
    volumes:
      - utpost_pgdata:/var/lib/postgresql/data
  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - "utpost_mongodata:/data/db"

volumes:
  utpost_pgdata:
  utpost_mongodata:
